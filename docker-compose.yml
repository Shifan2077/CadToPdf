services:
  postgres:
    image: postgres:16-alpine
    container_name: arecon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arecon}
      POSTGRES_USER: ${POSTGRES_USER:-arecon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - arecon-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-arecon} -d $${POSTGRES_DB:-arecon}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  arecon-postgres-data:
